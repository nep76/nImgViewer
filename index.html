<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="./main.css">
	<title>nImgViewer</title>
</head>

<body>
	<script type="module" src="./main.js"></script>
	
	<header>
		<h1>nImgViewer</h1>
		<button id="add" title="フォルダを追加" aria-label="フォルダを追加">＋</button>
		<button id="reset" title="追加されたフォルダを全てクリア" aria-label="追加されたフォルダを全てクリア">✕</button>
		<span id="status">0 枚</span>
	</header>

	<main>
		<div id="empty" hidden>「＋」から画像フォルダを選択</div>
	</main>

	<dialog id="rebuild-modal">
		<p id="rebuild-desc">画像を再表示するにはアクセス許可が必要です。</p>
		<button id="rebuild-ok" autofocus>承認して再表示</button> <button id="rebuild-abort">中断</button>
	</dialog>

	<dialog id="delete-modal">
		<p>画像一覧とフォルダの登録を削除します。<br>この操作は取り消せません。</p>
		<button id="delete-ok">削除</button> <button id="delete-cancel" autofocus>キャンセル</button>
	</dialog>

	<footer>
		<p>© 2026 nep · github: <a href="https://github.com/nep76/nImgViewer">nep76/nImgViewer</a></p>
	</footer>

</body>
</html>
