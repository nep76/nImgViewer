<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="./main.css">
	<title>nImgViewer</title>
</head>

<body>
	<script type="module" src="./main.js"></script>
	
	<header>
		<button id="add">フォルダを追加</button>
		<button id="reset">一覧をリセット</button>
		<span id="status">0 枚</span>
	</header>

	<div id="gallery"></div>
	<div id="empty">「フォルダを追加」から画像フォルダを選択</div>

	<dialog id="rebuild-modal">
		<p>ディレクトリアクセス権限が失われているため表示できません。</p>
		<button id="rebuild">再構築</button>
	</dialog>
</body>
</html>
